[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gooslicer"
version = "0.1.0"
description = "Native Linux slicer and LAN controller for ELEGOO Saturn 4 MSLA printers (.goo / SDCP v3)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PySide6-Essentials>=6.8",
  "numpy>=2.0",
  "scipy>=1.13",
  "trimesh>=4.4",
  "manifold3d>=3.0",
  "shapely>=2.0",
  "rtree>=1.2",
  "networkx>=3.2",
  "PyOpenGL>=3.1",
  "pillow>=10",
  "lxml>=5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gooslicer = "gooslicer_qt.main:main"
elegoo-lan = "elegoo_lan.__main__:main"
elegoo-goo = "elegoo_goo.__main__:main"

[tool.setuptools.packages.find]
include = ["gooslicer*", "gooslicer_qt*", "elegoo_lan*", "elegoo_goo*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
