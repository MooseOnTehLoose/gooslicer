app-id: io.github.mooseontehloose.GooSlicer
# freedesktop 26.08 (glibc 2.44) with Qt from the PySide6 wheels: the KDE runtime and PySide base
# (6.11) are on 25.08 (glibc 2.42), too old to load the host's ROCm for the GPU (spec 11)
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: gooslicer
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # OpenGL viewport (/dev/dri), and the GPU's compute device (/dev/kfd) for Select by Picture on
  # an AMD card: there is no narrower option for /dev/kfd
  - --device=all
  # Select by Picture on the GPU: the host's ROCm libraries, read-only, loaded by the app itself
  # (gooslicer/gpuhost.py) only where the runtime has no library of that name
  - --filesystem=host-os:ro
  - --share=network           # printer discovery (UDP broadcast), WebSocket and HTTP upload
  # SatelLite's printer, resin and support profiles are copied once from the user's own install
  # into the app's data folder (never shipped). This is the default Wine location; other locations:
  #   flatpak override --user --filesystem=/path/to/SatelLite:ro io.github.mooseontehloose.GooSlicer
  - --filesystem=~/.wine:ro
modules:
  - python3-deps.json

  # Select by Picture (11): MobileSAM, ONNX export by Acly (MIT), pinned to a commit and sha256
  - name: mobilesam
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/gooslicer/models mobile_sam_image_encoder.onnx sam_mask_decoder_multi.onnx
    sources:
      - type: file
        url: https://huggingface.co/Acly/MobileSAM/resolve/0d3b403339b4674a82493d5e97964dd78089ddc8/mobile_sam_image_encoder.onnx
        sha256: 580f5fb648ea1062c0aabc26217aed56921985f03f0cbbd852bba81d760cc749
      - type: file
        url: https://huggingface.co/Acly/MobileSAM/resolve/0d3b403339b4674a82493d5e97964dd78089ddc8/sam_mask_decoder_multi.onnx
        sha256: 8976b90a87ba50a6a72217a5ff994f7d25ce16f2229fcc1ed259e1294c622ffe

  - name: gooslicer
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 flatpak/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ..
        skip:
          - .venv
          - .pytest_cache
          - .flatpak-builder
          - build
          - dist
          - gooslicer.egg-info
          - samples
          - captures
          - evidence
          - models
          - tests
          - scripts
